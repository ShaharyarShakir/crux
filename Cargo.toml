[package]
name = "crux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A source-first, deterministic C/C++ package manager"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ShaharyarShakir/crux"
homepage = "https://shaharyarshakir.github.io/crux/"
keywords = ["package-manager", "cpp", "c", "cmake", "build-system"]
categories = ["command-line-utilities", "development-tools::build-utils"]
exclude = [
    ".github/",
    ".crux/",
    "target/",
    "docs/",
    "registry/",
    "tests/",
]

[[bin]]
name = "crux"
path = "src/main.rs"

[lib]
name = "crux"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
