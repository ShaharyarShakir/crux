name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: CI only needs to read the repository. Pull requests from
# forks always receive a read-only token; this makes pushes match.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-and-tests:
    name: Code Quality & Test Suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure Git identity
        # Tests create local fixture repositories and commits. They are owned
        # by the runner user, so no `safe.directory` exception is needed; the
        # checkout action already trusts the workspace. A wildcard
        # `safe.directory "*"` would disable Git's ownership protection for
        # every repository on the runner.
        run: |
          git config --global user.name "Crux CI Runner"
          git config --global user.email "ci@crux-pkg.org"

      - name: Ensure Rust components (rustfmt, clippy)
        run: |
          rustup component add rustfmt clippy

      - name: 1. Verify code formatting
        run: cargo fmt --check

      - name: 2. Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: 3. Verify compilation
        run: cargo check --all-targets

      - name: 4. Execute test suite
        run: cargo test

      - name: 5. Build optimized release binary
        run: cargo build --release

      - name: 6. Validate release binary execution
        run: |
          ./target/release/crux --version
          ./target/release/crux --help
