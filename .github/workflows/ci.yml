name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-and-tests:
    name: Code Quality & Test Suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity and safe directory
        run: |
          git config --global user.name "Crux CI Runner"
          git config --global user.email "ci@crux-pkg.org"
          git config --global --add safe.directory "*"

      - name: Ensure Rust components (rustfmt, clippy)
        run: |
          rustup component add rustfmt clippy

      - name: 1. Verify code formatting
        run: cargo fmt --check

      - name: 2. Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: 3. Verify compilation
        run: cargo check --all-targets

      - name: 4. Execute test suite
        run: cargo test

      - name: 5. Build optimized release binary
        run: cargo build --release

      - name: 6. Validate release binary execution
        run: |
          ./target/release/crux --version
          ./target/release/crux --help
