name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory
        run: git config --global --add safe.directory "*"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Extract release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Run release smoke test
        run: |
          ./target/x86_64-unknown-linux-gnu/release/crux --version
          ./target/x86_64-unknown-linux-gnu/release/crux --help

      - name: Package release archive
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TARGET="x86_64-unknown-linux-gnu"
          PKG_NAME="crux-${TAG}-${TARGET}"
          
          mkdir -p "dist/${PKG_NAME}"
          cp target/${TARGET}/release/crux "dist/${PKG_NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${PKG_NAME}/"
          
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          rm -rf "dist/${PKG_NAME}"
          
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Crux ${{ steps.vars.outputs.tag }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/crux-${{ steps.vars.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
