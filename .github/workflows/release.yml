name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

# Least privilege by default; only the release job may write (to publish).
permissions:
  contents: read

jobs:
  build-release:
    name: Build & Package Release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Extract and validate release version
        id: vars
        shell: bash
        # Untrusted event data is passed through the environment, never
        # interpolated into the script, and must be a strict release tag
        # before it is used in file names, commands, or release metadata.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Whole-string match (bash [[ =~ ]]), so a value containing a newline
          # can never pass validation or inject extra $GITHUB_OUTPUT keys.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid release tag '$TAG' (expected e.g. v0.2.1)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Run release smoke test
        run: |
          ./target/x86_64-unknown-linux-gnu/release/crux --version
          ./target/x86_64-unknown-linux-gnu/release/crux --help

      - name: Package release archive
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          TARGET="x86_64-unknown-linux-gnu"
          PKG_NAME="crux-${TAG}-${TARGET}"
          
          mkdir -p "dist/${PKG_NAME}"
          cp target/${TARGET}/release/crux "dist/${PKG_NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${PKG_NAME}/"
          
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          rm -rf "dist/${PKG_NAME}"
          
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Crux ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/crux-${{ steps.vars.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
